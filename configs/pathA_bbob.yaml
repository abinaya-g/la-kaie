# Exploratory BBOB extension (experiments/MPHBS_BBOB_ADDENDUM.md). Same arm definitions as configs/pathA.yaml;
# base = MPHBS B-C1 from configs/bbob_d10.yaml / bbob_d20.yaml. expected = (T, FE total) from the FE-probe calibration.
campaign: pathA_bbob
tie_tol: 1.0e-12
error_floor: 1.0e-8          # errors below COCO's final target are set to 1e-8 (solved runs tie)
arms:
  BBOB-D10:
    PA-SARSA:    {family: MPHBS,   base: MPHBS, flags: {},                 expected: [869, 99995]}
    PA-RND-FAIR: {family: MPHBS-V, base: MPHBS, flags: {mediator: random}, expected: [869, 99995]}
    PA-SKEL:     {family: MPHBS-V, base: MPHBS, flags: {skip_phase2: true}, expected: [1110, 99960]}
  BBOB-D20:
    PA-SARSA:    {family: MPHBS,   base: MPHBS, flags: {},                 expected: [1738, 199930]}
    PA-RND-FAIR: {family: MPHBS-V, base: MPHBS, flags: {mediator: random}, expected: [1738, 199930]}
    PA-SKEL:     {family: MPHBS-V, base: MPHBS, flags: {skip_phase2: true}, expected: [2221, 199950]}
runs: 30
contrasts:
  B1: [PA-SARSA, PA-RND-FAIR]   # learning
  B3: [PA-SARSA, PA-SKEL]       # mediator
groups:
  separable: [1, 2, 3, 4, 5]
  low/moderate conditioning: [6, 7, 8, 9]
  high conditioning: [10, 11, 12, 13, 14]
  multimodal, adequate structure: [15, 16, 17, 18, 19]
  multimodal, weak structure: [20, 21, 22, 23, 24]
decision:
  alpha: 0.05
  equivalence_band: [0.44, 0.56]
  bootstrap_resamples: 10000
  bootstrap_seed: 93000001
